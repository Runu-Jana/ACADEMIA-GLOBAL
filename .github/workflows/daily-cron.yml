name: Daily maintenance cron

# Pings the app's /api/cron endpoint once a day. That endpoint runs the
# scheduled tasks: commission promotion, re-engagement nudges, and the
# automatic directory catalogue sync. It's a plain HTTP call, so it works
# against Railway (or anywhere the app is hosted) without a worker service.
#
# Setup (one-time):
#   1. In GitHub → repo → Settings → Secrets and variables → Actions:
#        - Secret  CRON_SECRET  = the same value set in the app's environment
#        - Variable SITE_URL    = https://academia-global-production.up.railway.app
#          (optional — defaults below if unset)
#   2. The app must have CRON_SECRET set in its environment too, or /api/cron 503s.

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC daily = 07:00 IST
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the maintenance endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://academia-global-production.up.railway.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set — add it in repo Settings → Secrets → Actions." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron")
          echo "HTTP ${code}"
          cat /tmp/cron.json || true
          echo
          # Fail the run if the endpoint didn't return 200, so a broken cron is visible.
          test "${code}" = "200"
